services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-}
      - HEADLESS=${HEADLESS:-true}
      - BROWSER_CHANNEL=chrome
      - TARGET_COUNT=${TARGET_COUNT:-3}
      - OUTPUT_DIR=/app/data/snapshots
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - PAGE_LOAD_TIMEOUT=${PAGE_LOAD_TIMEOUT:-90000}
      - SELECTOR_TIMEOUT=${SELECTOR_TIMEOUT:-30000}
      - VIDEO_INIT_WAIT=${VIDEO_INIT_WAIT:-5000}
      - VIDEO_READY_TIMEOUT=${VIDEO_READY_TIMEOUT:-5000}
      - CAPTURE_TIMEOUT=${CAPTURE_TIMEOUT:-20000}
      - SCHEDULE_TIMES=${SCHEDULE_TIMES:-05:00}
      - TZ=${TZ:-Asia/Makassar}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - GOOGLE_GENAI_MODEL=${GOOGLE_GENAI_MODEL:-models/gemini-flash-latest}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BATCH_SIZE=${TELEGRAM_BATCH_SIZE:-5}
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/captures:/app/data/captures
      - ./logs:/app/logs
    env_file:
      - .env
